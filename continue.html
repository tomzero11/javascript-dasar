<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continue</title>
</head>
<body>
    <script>
        
        /* 
            Continue
        => Continue digunanakn untuk menghentikan perulangan saat ini, 
            lalu melanjutkan ke iterasi berikutnya.
        */

        for (let i = 1; i <= 50; i++) {
            if ( i % 2 === 0) {
                continue // Pernyataan continue di JavaScript ibaratnya sama dengan "skip" (melewati).
            }
            document.writeln(`<p> bilangan ganjil ${i}`)
        }
    </script>
</body>
</html>
