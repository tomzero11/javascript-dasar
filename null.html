<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NULL</title>
</head>
<body>
    <script>
        /* null merupakan representasi data kosong*/
        /* null berbeda dengan undefined, null berarti variable yang sudah ditambahkan value nya, tapi hanya saja value nya null atau kosong*/
        /* Undefined varible yang belum di tambahkan value apapun */
        
        /* Contoh type data null */
        let name = null
        if(name === undefined) {
            alert(false)
        }else if (name === null) {
            alert(true)
        } else {
            alert(name)
        }
    </script>
</body>
</html>
