<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator TypeOf</title>
</head>
<body>
    <script>
        /* typeof merupakan operator yang bisa digunakan untuk melihat type data sebuah variable*/
        /* karena JavaScript merupakan dynamic language, kadang kita perlu mengecek type data sebuah variable*/
        
        /* Mengecek isi type data dari varible*/
        let data = null
        const typeData = typeof data;
        document.writeln(`<p> ${typeData} </p>`)
    </script>
</body>
</html>
