<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scope</title>
</head>
<body>
    <script>

        /*
            Scope
        => Scope merupakan area akses sebuah data
        => ada dua jenis Scope, Global Scope dan Local Scope
        => Setiap kita membuat function, maka kita akan membuat local scope,
            untuk function tersebut.
        => Data di Global Scope bisa diakses dari local scope, namun data di local
            scope hanya bisa di akses di local scope tersebut atau di scope di bawahnya
            (dalam kasus function dalam function / Nested Function)
        */

        /*
            CATATAN 
        => Local bisa akses data dari Global
        => Global tidak bisa akses data dari Local
        */ 

        // GLobal Score
        let counter = 0

        // GLobal Score
        function getCounter() {
            // Local Scope getCounter
            counter++
            document.writeln(`<p> hitung counter ${counter} </p>`)
        }

        // Global Scope
        for(let i = 1; i <= 20; i++) {
            getCounter()
        }

        // Contoh Akses Local Scope di Global Scope Hasil nya akan ERROR
        function first() {
            let firsName = "Mamad"
            document.writeln(firsName)
        }
        function last() {
            let lastName = "Mamad"
            document.writeln(lastName)
        }
        first()
        last()
        // console.log(firsName) // Hasil Error, Global tidak bisa akses data dari Local
        // console.log(lastName)  // Hasil Error, Global tidak bisa akses data dari Local




        // Contoh Global dan Local Nested Function
        // Global Scope
        function giveMeNumber() {
            //Local Scope function giveMeNumber tapi akan menjadi Global Score di function child pertama nya
            let value = 0 // ini bisa di akses di childnya, hanya child pertama
            function number() {
                // Local Scope function number
                let dataNumber = [1,2,3,4,5,6]
                value++ // mengakses value dari variable parent nya
                document.writeln(`<p> value ${value} </p>`)
            }
            for (let i = 1; i <= 20; i++) {
                number()
            }

            console.log(dataNumber[0]) // Error karena tidak dapat mengakses data dari child nya, karena bersifat Local Scope
        }
        giveMeNumber()

    </script>
</body>
</html>
