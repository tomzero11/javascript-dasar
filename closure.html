<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closure</title>
</head>
<body>
    <script>

        /*
            Closure
        => Closure adalah kombinasi function dan bundel referensi ke data sekitarnya
        => Kita sudah tau bahwa local scope tidak bisa diakses di luar scope nya,
            artinya hanya bisa di akses di dalam scope nya (Tidak bisa di akses oleh Parent)
        => Dengan kemampuan Closure, kita bisa membuat sebuah function di local scope 
            dan referensi ke data di sekitar local scope tersebut, keluar scope nya.
            Arinya : Data Local yang seharus nya tidak bisa di akses oleh Parent, dengan menggunakan 
            Closure Parent Jadi bisa mengakses Data atau variable di Local Scope (CHILD)
        */
        
        // Global Scope
        const sumValue = (value) => {
            // Local Scope
            const name = "Mamad"
            const perjumlahan = (nilai) => {
                document.writeln(`<p> ${name} </p>`)
                return value + nilai
            }
            return perjumlahan // Closure mengeluarkan dari local scope ke parent nya
        }
        const nilaiPejumlahan = sumValue(2)
        document.writeln(`nilai penjumlahan ${nilaiPejumlahan(10)}`) // Hasil 12

    </script>
</body>
</html>
