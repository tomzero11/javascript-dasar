<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function</title>
</head>
<body>
    <script>
        /*
            Function
        => Function adalah block code program yang akan berjalan saat kita panggil
        => Untuk membuat function, kita bisa menggunakan kata kunci function, lalu 
            diikuti dengan nama function, kurung "()"" dan diakhiri dengan block kurung "{}"
        => kita bisa memanggil function dengan menggunakan nama function lalu diikuti dengan kurung ()

        */
        // Kita bisa buat code block di dalam function jika butu tinggal panggil functionnya.
        function saHelloWorld() {
            document.writeln(`<p> Hello World </p>`)
        }
        saHelloWorld()
        saHelloWorld()
        saHelloWorld()
    </script>
</body>
</html>
