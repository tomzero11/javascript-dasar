<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Unery</title>
</head>
<body>
    <script>
        let number = 1
        document.writeln("<p>" + number + "</p>")
        number --
        document.writeln("<p>" + number + "</p>")
        number ++
        document.writeln("<p>" + number + "</p>")
        number = -number
        document.writeln("<p>" + number + "</p>")
    </script>
</body>
</html>
