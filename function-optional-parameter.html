<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Optional Parameter</title>
</head>
<body>
    <script>

        /*
            Optional Parameter
        => Secara default, parameter di function itu bersifat optional.
        => Artinya tidak wajib mengisi value ketika memanggil function tersebut.
        => Jika tidak ada value yang kita kirim ke parameter ketika memanggil funtion tersebut, 
            secara otomatis parameter tersebut berninai undefined.
        */

        function sayHello(firstName, middleName, lastName) {
            const say = `Hello ${firstName} ${middleName} ${lastName}`
            return say
        }
        const say = sayHello("Mamad")
        document.writeln(say)

    </script>
</body>
</html>
