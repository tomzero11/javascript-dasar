<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console</title>
</head>
<body>
    <script>
        console.info("console.log dan console.info (sama)") // output dalam bentuk console
        console.warn("console.warn") // console warning atau peringatan
        console.error("console.error") // console digunakan untuk chect error 
        console.table("console.table (khusus untuk console Type Data Array atau type Object)")
        /* console table digunakan untuk mengecek hasil type data array atau type data object */
    </script>
</body>
</html>
