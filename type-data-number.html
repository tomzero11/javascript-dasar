<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Data Number</title>
</head>
<body>
    <script>
        // Type data number di javascript itu hanya satu mau decimal atau bulat semua di jadikan satu berupa number
        document.writeln(200) // bilangan bulat
        document.writeln("<br>")
        document.writeln(4.3) // bilangan desimal atau pecahan (float)

    </script>
</body>
</html>
