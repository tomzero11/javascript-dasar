<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Parameter</title>
</head>
<body>
    
    <script>   

        /*
            Functin Parameter
        => Kita bisa mengirim infromasi ke functon yang ingin kita panggil
        => Untuk melakukan hal tersebut, kita perlu menambahkan parameter
            atau argument di function yuang sudah kita buat.
        => Parameter ditempatkan di dalam kurung () di deklarasi method
        => Parameter bisa lebih dari satu, jika lebih dari satu, harus di pisah
            mengggunakan tanda koma.
        */

        const dataEmployee = {
            firstName : "jajang",
            lastName : "Kusnandar"
        }

        const dataManager = {
            firstName : "Riski",
            lastName  : "Aditama"
        }

        function dataNameEmployee(employee) {
            document.writeln(`<p> Hello ${employee.firstName} ${employee.lastName}`)
        }

        dataNameEmployee(dataEmployee)
        dataNameEmployee(dataManager)

    </script>
</body>
</html>
