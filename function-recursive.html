<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Recursive</title>
</head>
<body>
    <script>
        /*
            Recursive Function 
        => Recursive Function adalah kemampuan function memanggil function dirinya sendiri
        => Kadang memang ada banyak problem, yang leih mudah di selesaikan menggunakan 
            recursive function, contoh nya kasus Factorial
        */

        // Contoh Tanpa Menggunakan Recursive Functoin
        function factorial(value) {
            let angka = 1
            for (let i = 1; i <= value; i++) {
                angka = angka *  i
            }
            document.writeln(` ${value}!`)
            document.writeln(angka)
        }
        factorial(5)

        function factorialRecursive(value) {
            if (value === 1) {
                return 1
            } else {
                return value * factorialRecursive(value - 1 )
                // 5 * factorialRecursive(4)
                // 5 * 4 factorialRecursive(3)
                // 5 * 4 * 3 factorialRecursive(2)
                // 5 * 4 * 3 * 2 factorialRecursive(1)
                // 5 * 4 * 3 * 2 * 1
            }
        }
        document.writeln(factorialRecursive(5)) // 120

        /* 
            CATATAN : 
            Ketika sebuah fungsi memanggil dirinya sendiri (rekursif), 
            fungsi tersebut akan terus mengeksekusi dirinya berulang kali 
            seperti looping sampai kondisi berhentinya (base case) terpenuhi / false, 
            meskipun tidak ada kode for atau while di dalamnya.
            Jika tidak ada false dia akan selalu looping sampai tak hingga.
        */ 
    </script>
</body>
</html>
