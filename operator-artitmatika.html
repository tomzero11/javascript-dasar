<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Aritmatika</title>
</head>
<body>
    <script>
        // operator aritmatika
        let result = 1 + 2 
        document.writeln("<p> 1 + 2 = " + result + "</p>")
        let origitnalResult = result
        
        result = result - 1
        document.writeln("<p>" + origitnalResult + "-1 = " + result + "</p>")
        origitnalResult = result
        
        result = result * 2
        document.writeln("<p>" +  origitnalResult + " * 2 = " + result + "</p>")
        
        
    </script>
</body>
</html>
